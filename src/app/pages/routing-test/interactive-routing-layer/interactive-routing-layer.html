<!-- 攤位繪製層 -->
<canvas #stallCanvas class="absolute top-0 left-0 w-full h-full pointer-events-none"> </canvas>

@let cn = currHoveredNode();
<div
  #opTarget
  class="absolute bg-transparent pointer-events-none"
  [style.top]="``"
  [style.left]="``"
  tooltipPosition="bottom"
  [tooltipDisabled]="!currHoveredNode()"
  [pTooltip]="tooltipContent"
></div>
<ng-template #tooltipContent>
  <div class="flex flex-col gap-1">
    <div [innerHTML]="cn?.info?.note"></div>
  </div>
</ng-template>

<app-edit-note-popover [bookmark]="focusList()" [node]="currClickNode()" [dismissable]="false">
</app-edit-note-popover>
