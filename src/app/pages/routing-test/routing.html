<main>
  <div class="h-screen flex flex-col relative">
    <div class="flex-grow flex h-full">
      <div class="flex flex-col flex-grow h-full gap-2 p-4 max-w-[350px]">
        <div class="flex items-center">
          書籤列表
          <p-button
            class="ml-auto"
            icon="pi pi-home"
            size="small"
            pTooltip="返回攤位地圖"
            [rounded]="true"
            [text]="true"
            [routerLink]="['/']"
          >
          </p-button>
        </div>
        <app-create-marked-list-btn> </app-create-marked-list-btn>

        <div class="overflow-y-auto">
          <app-bookmark-list> </app-bookmark-list>
        </div>
      </div>

      <div class="flex-grow h-full text-gray-600 dark:text-gray-50">
        <app-base-map>
          <app-routing-layers></app-routing-layers>
          <app-bookmark-layer></app-bookmark-layer>
          <app-interactive-routing-layer></app-interactive-routing-layer>
          <app-interactive-layer></app-interactive-layer>
        </app-base-map>
      </div>
    </div>
  </div>
</main>
