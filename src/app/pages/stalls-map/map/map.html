<div
  #mapViewport
  class="h-full flex items-center justify-center overflow-hidden bg-transparent relative"
>
  <!-- 背景圖 -->
  <div
    class="absolute top-0 left-0 h-full w-full opacity-10 bg-center bg-repeat bg-size-[auto_150px] bg-[url(assets/images/icon-coomic4.png)]"
  ></div>

  @if (isInitialLoading() || !mapImgLoaded()) {
    <div
      class="absolute top-0 left-0 z-1 size-full flex items-center justify-center bg-gray-200/50"
    >
      <mat-icon
        class="animate-spin dark:!text-gray-600"
        aria-hidden="false"
        aria-label="auto renew"
        fontIcon="autorenew"
      ></mat-icon>
    </div>
  } @else if (isInitialError()) {}

  <!-- 地圖 container 負責 transform 放大縮小 -->
  <div
    id="download-map-container"
    #mapContainer
    class="h-full w-full flex items-center justify-center overflow-hidden will-change-transform"
    [style.transform]="`scale(${scale()})`"
    (wheel)="onWheel($event)"
  >
    <!-- 地圖 content 負責 拖曳互動 -->
    <div
      #mapContent
      class="relative max-w-full max-h-full rounded-lg overflow-hidden select-none cursor-grab active:cursor-grabbing touch-none"
      [class.transition-transform]="autoFocusing()"
      [class.duration-300]="autoFocusing()"
      [style.aspect-ratio]="imageAspectRatio()"
      cdkDrag
      (cdkDragStarted)="onDragStarted($event)"
      (cdkDragEnded)="onDragEnded($event)"
      [cdkDragConstrainPosition]="constrainPosition"
      [cdkDragFreeDragPosition]="freePosition"
      (touchstart)="onTouchStart($event)"
      (touchmove)="onTouchMove($event)"
      (touchend)="onTouchEnd($event)"
    >
      <!-- 攤位底圖 -->
      @if (mapImgSrc()) {
        <img
          #mapImage
          class="w-full h-full object-contain pointer-events-none"
          [src]="mapImgSrc()"
          alt="Background Map"
          (load)="onMapImageLoad($event)"
          (error)="onMapImageError()"
        />
      }

      <!-- 攤位樣式和互動 -->
      <div class="">
        <app-stalls-canvas></app-stalls-canvas>
        <app-wishlist-layer></app-wishlist-layer>
        <app-search-layer></app-search-layer>
        <app-interactive-layer></app-interactive-layer>
      </div>

      <!-- group 攤位 -->
      <div class="">
        @for (zone of stallZoneDef(); track $index) {
          <app-stall-group-area [zone]="zone"></app-stall-group-area>
        }
      </div>

      <!-- 場內 only 區 -->
      <div class="pointer-events-none">
        @if (showAreas()) {
          @for (area of selectedAreas(); track $index) {
            <div
              class="absolute top-0 left-0 w-full h-full pointer-events-none"
              [ngClass]="{ 'hover:cursor-pointer': area.link }"
              (click)="openUrl(area.link)"
            >
              <svg [attr.viewBox]="`0 0 ${mapWidth()} ${mapHeight()}`" class="pointer-events-none">
                <!-- 動態繪製攤位的多邊形 -->
                <polygon
                  [attr.points]="area.polygonPoints"
                  [attr.fill]="area.fillColor"
                  [attr.opacity]="0.5"
                  [attr.stroke]="'gray'"
                  stroke-width="1"
                />
                <!-- 文字顯示在 polygon 中心 -->
                <text
                  [attr.fill]="area.textColor"
                  [attr.x]="area.textPointX"
                  [attr.y]="area.textPointY"
                  text-anchor="middle"
                  alignment-baseline="middle"
                  font-size="8"
                  style="pointer-events: none"
                  [style.writingMode]="area.textLayout === 'VERTICAL' ? 'vertical-rl' : ''"
                >
                  {{ area.name }}
                </text>
              </svg>
            </div>
          }
        }
      </div>

      <!-- <div class="">
        <div class="absolute" [style.top.%]="50" [style.left.%]="80">A</div>
        <div class="absolute" [style.top.%]="50" [style.left.%]="75">B</div>
        <div class="absolute" [style.top.%]="50" [style.left.%]="70">C</div>
      </div> -->
    </div>
  </div>

  <!-- Sticky 區域標籤層（與地圖內容同級，不隨地圖 transform） -->
  <div class="absolute inset-0 pointer-events-none">
    @for (zone of anchorZones(); track zone) {
      <div #zoneLabel class="absolute zone-sticky-label" [attr.data-zone]="zone.zoneId">
        {{ zone.zoneId }}
      </div>
    }
  </div>
</div>
