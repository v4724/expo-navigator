<div class="fixed top-0 left-12 right-0 layout-topbar px-4 z-2 pointer-events-none">
  <div class="py-2 flex items-center gap-2">
    <div class="flex items-center pointer-events-auto gap-2">
      <div class="w-80">
        <app-input-search></app-input-search>
      </div>
    </div>

    <div class="ml-auto pointer-events-auto">
      <app-user></app-user>
    </div>

    @if (downloadMapSwitch()) {
      <app-download-map
        class="pointer-events-auto"
        [elId]="'download-map-container'"
      ></app-download-map>
    }

    <div
      class="legend-container py-2 px-4 top-3 bg-white/60 dark:bg-zinc-700/60 dark:text-gray-300 border border-solid border-gray-300 dark:border-zinc-700"
    >
      <div class="legend-item">
        <span class="legend-box legend-default"></span><span>攤位</span>
      </div>
      <div class="legend-item">
        <span class="relative legend-box legend-default legend-print-survey"></span>
        <span>印調</span>
      </div>
      <div class="legend-item">
        <span class="legend-box legend-promo"></span><span>宣傳車</span>
      </div>
      <div class="legend-item">
        <span class="legend-box legend-search"></span><span>搜尋結果</span>
      </div>
      <div class="legend-item">
        <span class="legend-box legend-selected"></span><span>選擇中</span>
      </div>
    </div>
  </div>
</div>
