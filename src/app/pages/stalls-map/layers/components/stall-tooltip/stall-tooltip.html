@let ref = hoveredStallInfo();
@if (ref) {
  <div
    class="absolute bg-transparent z-1"
    [style.top.px]="ref.rect.top"
    [style.left.px]="ref.rect.left"
    [style.width.px]="ref.rect.width"
    [style.height.px]="ref.rect.height"
    [pTooltip]="ref.s?.stallTitle ?? ''"
    (click)="passThroughEvent($event)"
    (wheel)="forwardWheel($event)"
  ></div>
}
