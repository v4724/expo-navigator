<app-drawer-on-mobile (onShow)="onShow()">
  <div title class="flex items-center gap-2 w-full">
    <div class="text-lg">書籤</div>
    @if (!atRoutingPage()) {
      <p-toggleswitch [(ngModel)]="checked" (change)="toggleLayer()" />
    }
    @if (bookmarkRoutingSwitch() && !atRoutingPage()) {
      <button
        pButton
        class="ml-auto dark:!text-gray-300"
        icon="pi pi-directions"
        size="small"
        pTooltip="前往路徑規劃"
        [rounded]="true"
        [text]="true"
        (click)="gotoRouting()"
      ></button>
    }
  </div>

  <div class="flex flex-col gap-2">
    @if (isLogin()) {
      <app-create-marked-list-btn> </app-create-marked-list-btn>
    }
    <app-bookmark-list> </app-bookmark-list>
  </div>
</app-drawer-on-mobile>
