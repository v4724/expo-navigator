<app-drawer-on-mobile>
  <div title class="flex items-center gap-2">
    <div class="text-lg">場內 Only</div>
    <p-toggleswitch [(ngModel)]="checked" (change)="toggleLayer()" />
  </div>
  <div class="flex flex-col gap-2">
    @if (!areaFetchEnd()) {
      <mat-icon
        class="animate-spin"
        aria-hidden="false"
        aria-label="auto renew"
        fontIcon="autorenew"
      ></mat-icon>
    }
    @if (allAreas().length) {
      <div class="flex flex-wrap mt-2 gap-2" animate.enter="fade-in" animate.leave="fade-out">
        @for (area of allAreas(); track area.areaId) {
          <div
            class="flex items-center border border-gray-200 rounded-full py-1 px-2"
            [ngClass]="{ 'cursor-pointer transition hover:scale-110': area.link }"
            [style.backgroundColor]="area.fillColor"
            [style.fontColor]="area.textColor"
            (click)="openUrl(area.link)"
          >
            <span class="text-sm text-gray-600">{{ area.areaName }} </span>
            @if (area.link) {
              <mat-icon
                inline
                aria-hidden="false"
                aria-label="open_in_new"
                fontIcon="open_in_new"
              ></mat-icon>
            }
          </div>
        }
      </div>
    }
  </div>
</app-drawer-on-mobile>
