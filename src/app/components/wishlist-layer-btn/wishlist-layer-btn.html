<div
  class="flex gap-2 rounded-full border border-gray-300 py-1 px-4 bg-white/60 dark:bg-zinc-700/60 border border-solid border-gray-300 dark:border-zinc-700"
>
  <button
    class="flex transition hover:scale-110 rounded-full pr-3 items-center"
    (click)="popover.toggle($event)"
  >
    吃土單
  </button>
</div>

<p-popover #popover>
  <div class="flex flex-col gap-2 max-w-sm">
    <div title class="flex items-center">
      <div class="text-base">開啟攤位分布</div>
      <p-button
        icon="pi pi-question-circle"
        size="small"
        text
        rounded
        pTooltip="重複出現的攤位會被後顯示的吃土單顏色覆蓋。"
        tooltipPosition="top"
      ></p-button>
      <p-toggleswitch [size]="'small'" [(ngModel)]="checked" (change)="toggleLayer()" />
    </div>
    <div class="flex flex-col gap-2">
      @for (item of wishlist(); track item) {
        <div class="flex items-center rounded-full py-1 px-2 gap-1">
          <p-toggleswitch
            [size]="'small'"
            [(ngModel)]="item.checked"
            (change)="toggleWishlistItem(item)"
          />

          <div class="relative">
            <span class="text-sm text-gray-600">{{ item.name }} </span>
            <div
              class="absolute w-full h-1/5 bottom-0 left-0"
              [style.backgroundColor]="item.fillColor"
            ></div>
          </div>

          @if (item.url) {
            <mat-icon
              inline
              aria-hidden="false"
              aria-label="open_in_new"
              fontIcon="open_in_new"
              (click)="openUrl(item.url)"
            ></mat-icon>
          }
        </div>
      }
    </div>
  </div>
</p-popover>
