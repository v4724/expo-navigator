@switch (wishlistId()) {
  @case ('COOMIC4_R1') {
    <app-coomic4-r1-view
      [wishlistId]="wishlistId()"
      [wishlistConfigJson]="wishlistConfigJson()"
    ></app-coomic4-r1-view>
  }
  @case ('COOMIC4_UOTO') {
    <app-coomic4-uoto-view
      [wishlistId]="wishlistId()"
      [wishlistConfigJson]="wishlistConfigJson()"
    ></app-coomic4-uoto-view>
  }
  @case ('COOMIC4_NUCARNIVAL') {
    <app-coomic4-nucarnival-view
      [wishlistId]="wishlistId()"
      [wishlistConfigJson]="wishlistConfigJson()"
    ></app-coomic4-nucarnival-view>
  }
  @case ('COOMIC4_TOUKEN') {
    <app-coomic4-touken-view
      [wishlistId]="wishlistId()"
      [wishlistConfigJson]="wishlistConfigJson()"
    ></app-coomic4-touken-view>
  }
  @case ('COOMIC4_KOREA') {
    <app-coomic4-korea-view
      [wishlistId]="wishlistId()"
      [wishlistConfigJson]="wishlistConfigJson()"
    ></app-coomic4-korea-view>
  }
  @case ('COOMIC4_100_M') {
    <app-coomic4-100-m-view
      [wishlistId]="wishlistId()"
      [wishlistConfigJson]="wishlistConfigJson()"
    ></app-coomic4-100-m-view>
  }
  @case ('COOMIC4_KIMETSU') {
    <app-coomic4-kimetsu-view
      [wishlistId]="wishlistId()"
      [wishlistConfigJson]="wishlistConfigJson()"
    ></app-coomic4-kimetsu-view>
  }
  @case ('COOMIC4_BOKYAKU') {
    <app-coomic4-bokyaku-view
      [wishlistId]="wishlistId()"
      [wishlistConfigJson]="wishlistConfigJson()"
    ></app-coomic4-bokyaku-view>
  }
  @default {
    @if (wishlistId()) {
      <div class="py-4">無對應來源</div>
    }
  }
}
