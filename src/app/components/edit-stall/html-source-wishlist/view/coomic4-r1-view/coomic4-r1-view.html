<div class="flex">
  @if (isLoading()) {
    <div class="flex flex-col w-full gap-3">
      <p-skeleton class="!w-1/4" height="1.2rem"></p-skeleton>
      <p-skeleton class="!w-1/3" height="1.2rem"></p-skeleton>
      <p-skeleton class="!w-1/2" height="1.2rem"></p-skeleton>
    </div>
  } @else {
    <div>
      @if (items.length === 0 && stallId && authorName) {
        <p>沒有找到對應的品項</p>
      } @else {
        @for (item of items; track item) {
          <div>
            <p>
              {{ item.name }}, {{ item.author }}, {{ item.description }}, {{ item.category }},
              {{ item.price }}, {{ item.stock }}
            </p>
          </div>
        }
      }
    </div>
  }
</div>
