@switch (wishlistId()) {
  @case ('COOMIC4_R1') {
    <app-coomic4-r1></app-coomic4-r1>
  }
  @case ('COOMIC4_UOTO') {
    <app-coomic4-uoto></app-coomic4-uoto>
  }
  @case ('COOMIC4_NUCARNIVAL') {
    <app-coomic4-nucarnival></app-coomic4-nucarnival>
  }
  @case ('COOMIC4_TOUKEN') {
    <app-coomic4-touken></app-coomic4-touken>
  }
  @case ('COOMIC4_KOREA') {
    <app-coomic4-korea></app-coomic4-korea>
  }
  @default {
    @if (wishlistId()) {
      <div class="py-4">無對應來源</div>
    }
  }
}
